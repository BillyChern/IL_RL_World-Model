[project]
name = "il-rl-world-model"
version = "0.1.0"
description = "Integrating Imitation Learning, Real-Time RL, and World Models for Robotic Manipulation"
authors = [
    {name = "Billy Chern (Shichen)", email = "shichen22@m.fudan.edu.cn"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["robotics", "reinforcement-learning", "imitation-learning", "world-models", "vla"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core ML frameworks
    "torch>=2.2.0",
    "jax[cuda12]>=0.4.35",
    "jaxlib>=0.4.35",
    "flax>=0.10.0",
    "optax>=0.2.0",

    # Vision and Language models
    "transformers>=4.53.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",

    # OpenPI dependencies
    "einops>=0.8.0",
    "timm>=1.0.0",

    # LeRobot and datasets
    "datasets>=3.0.0",
    "huggingface-hub>=0.26.0",
    "pyarrow>=17.0.0",

    # RL and robotics
    "gymnasium>=0.29.0",
    "dm-env>=1.6",
    "dm-control>=1.0.0",

    # World model (Dreamer dependencies)
    "numpy>=1.24.0",
    "scipy>=1.11.0",

    # Data and visualization
    "opencv-python>=4.10.0",
    "imageio>=2.35.0",
    "imageio-ffmpeg>=0.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",

    # Logging and monitoring
    "wandb>=0.18.0",
    "tensorboard>=2.18.0",

    # Configuration
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",

    # Utilities
    "tqdm>=4.66.0",
    "rich>=13.9.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",

    # Async and multiprocessing
    "aiohttp>=3.10.0",
    "uvloop>=0.20.0; sys_platform != 'win32'",

    # Testing
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-asyncio>=0.24.0",

    # Code quality
    "black>=24.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.27.0",
    "ipdb>=0.13.0",
    "jupyter>=1.1.0",
    "jupyterlab>=4.2.0",
]

robot = [
    # ARX X5 SDK dependencies (to be added based on actual SDK requirements)
    "pyserial>=3.5",
    "can>=0.0.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/BillyChern/IL_RL_World-Model"
Documentation = "https://github.com/BillyChern/IL_RL_World-Model/blob/master/README.md"
Repository = "https://github.com/BillyChern/IL_RL_World-Model"
Issues = "https://github.com/BillyChern/IL_RL_World-Model/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "jax.*",
    "flax.*",
    "optax.*",
    "dm_env.*",
    "dm_control.*",
    "transformers.*",
    "einops.*",
    "timm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "robot: marks tests that require real robot hardware",
    "gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["models", "training", "robot", "evaluation"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
